name: wt-voice-tts-001

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Successful measurement repetitions per lane
        required: true
        default: "3"
      full_matrix:
        description: Run EN/ES x FP32/int8 x 1/2/4/8 sessions
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - ".github/wt-voice-tts-001.trigger"

jobs:
  qualify:
    # Existing voice-host runner lane. The scoped push trigger is deliberately
    # bounded to the single-session quantized lane. A full matrix is admitted
    # only by explicit workflow_dispatch after the bounded lane is clean.
    runs-on: [self-hosted, voice]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark runtime
        run: pip install -e . pocket-tts pyyaml faster-whisper
      - name: Record host identity
        run: |
          mkdir -p evidence/wt-voice-tts-001
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_NAME}"
            uname -a
            python --version
            python -c 'import platform; print(platform.platform()); print(platform.machine())'
          } > evidence/wt-voice-tts-001/host.txt
      - name: Run qualification matrix
        env:
          RUNS: ${{ inputs.runs || '3' }}
          # Push-triggered qualification is always the bounded first lane.
          # Only an explicit manual dispatch can admit the full matrix.
          FULL_MATRIX: ${{ github.event_name == 'workflow_dispatch' && inputs.full_matrix || 'false' }}
        run: |
          set -euo pipefail
          # sessions=1 has nothing to cross-talk into, so it never needs the
          # (slower) real ASR check. sessions>1 needs it to leave
          # TEST_INVALID -- see voxmaestro.tts.crosstalk.
          if [ "$FULL_MATRIX" = "true" ]; then
            for language in en es; do
              for sessions in 1 2 4 8; do
                crosstalk_flag=""
                if [ "$sessions" != "1" ]; then
                  crosstalk_flag="--use-whisper-crosstalk-check"
                fi
                python examples/run_wt_voice_tts_001.py \
                  --language "$language" --sessions "$sessions" --runs "$RUNS" $crosstalk_flag
                python examples/run_wt_voice_tts_001.py \
                  --language "$language" --sessions "$sessions" --runs "$RUNS" --quantize $crosstalk_flag
              done
            done
          else
            python examples/run_wt_voice_tts_001.py --language en --sessions 1 --runs "$RUNS" --quantize
          fi
      - name: Upload raw qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wt-voice-tts-001-${{ github.sha }}
          path: evidence/wt-voice-tts-001/
          if-no-files-found: error
